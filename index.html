<!DOCTYPE html>
<html lang="es" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RutaFit - Tracker de Entrenamiento</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Alpine.js for dynamic reactive UI -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              accent: '#06b6d4'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar for modern feel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 flex flex-col" x-data="workoutApp()">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-xl shadow-lg shadow-purple-500/20">
          <i class="fa-solid font-black fa-dumbbell text-xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">
            RutaFit <span class="text-xs text-purple-400 font-semibold px-2 py-0.5 rounded-full bg-purple-950 border border-purple-800/50">PRO</span>
          </h1>
          <p class="text-xs text-slate-400">Rutina Semanal & Registro de Series</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button @click="resetData()" class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-rose-950/60 hover:text-rose-400 text-slate-300 border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-left"></i>
          <span>Restablecer</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Body -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

    <!-- Stats Bar & Progress Summary -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl shadow-sm flex items-center gap-4">
        <div class="p-3 bg-purple-500/10 text-purple-400 rounded-lg">
          <i class="fa-solid fa-calendar-day text-lg"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Día Actual</p>
          <p class="text-base font-bold text-slate-200 truncate" x-text="days[activeDayIndex].name"></p>
        </div>
      </div>

      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl shadow-sm flex items-center gap-4">
        <div class="p-3 bg-cyan-500/10 text-cyan-400 rounded-lg">
          <i class="fa-solid fa-list-check text-lg"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Ejercicios D1-D6</p>
          <p class="text-xl font-bold text-slate-200" x-text="getTotalExercises()"></p>
        </div>
      </div>

      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl shadow-sm flex items-center gap-4">
        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg">
          <i class="fa-solid fa-circle-check text-lg"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Series Completadas Hoy</p>
          <p class="text-xl font-bold text-emerald-400" x-text="getCompletedSetsCount() + ' / ' + getTotalSetsCount()"></p>
        </div>
      </div>

      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl shadow-sm flex items-center gap-4">
        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg">
          <i class="fa-solid fa-weight-hanging text-lg"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Volumen Movido Hoy</p>
          <p class="text-xl font-bold text-amber-300" x-text="getTodayVolume() + ' kg'"></p>
        </div>
      </div>
    </section>

    <!-- Days Navigation Tabs -->
    <nav class="flex overflow-x-auto gap-2 pb-2 scrollbar-thin border-b border-slate-800/80">
      <template x-for="(day, index) in days" :key="index">
        <button 
          @click="activeDayIndex = index"
          :class="{
            'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-600/20 border-purple-500': activeDayIndex === index,
            'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 border-slate-800': activeDayIndex !== index
          }"
          class="flex-shrink-0 px-4 py-3 rounded-xl border text-left transition-all duration-200 flex flex-col min-w-[150px] relative group"
        >
          <span class="text-[10px] uppercase tracking-wider opacity-75 font-semibold" x-text="'Día ' + (index + 1)"></span>
          <span class="text-sm font-bold truncate max-w-[130px]" x-text="day.name"></span>
        </button>
      </template>
    </nav>

    <!-- Active Day Section -->
    <section class="space-y-6">
      
      <!-- Day Header & Name Editor -->
      <div class="bg-slate-900/80 border border-slate-800 p-4 sm:p-5 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-purple-400 uppercase tracking-wider mb-1">Nombre del Día</label>
          <input 
            type="text" 
            x-model="days[activeDayIndex].name" 
            @input="saveToLocalStorage()"
            class="w-full bg-slate-950 border border-slate-700/80 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 rounded-lg px-3 py-2 text-lg font-bold text-slate-100 transition"
            placeholder="Ej. Pecho y Tríceps"
          />
        </div>

        <button 
          @click="addExercise(activeDayIndex)" 
          class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm shadow-md shadow-purple-600/30 transition hover:scale-[1.01] active:scale-[0.99]"
        >
          <i class="fa-solid fa-plus"></i>
          <span>Agregar Ejercicio</span>
        </button>
      </div>

      <!-- Exercise Cards Container -->
      <div class="grid grid-cols-1 gap-6">

        <!-- Empty State -->
        <template x-if="days[activeDayIndex].exercises.length === 0">
          <div class="text-center py-12 px-4 border-2 border-dashed border-slate-800 rounded-2xl bg-slate-900/40">
            <div class="inline-flex p-4 rounded-full bg-slate-800/80 text-slate-500 mb-3">
              <i class="fa-solid fa-dumbbell text-3xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300">No hay ejercicios para este día</h3>
            <p class="text-sm text-slate-500 max-w-sm mx-auto mt-1 mb-4">Empieza agregando tu primer ejercicio para registrar tus repeticiones y pesos.</p>
            <button 
              @click="addExercise(activeDayIndex)"
              class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-medium text-sm transition"
            >
              + Agregar primer ejercicio
            </button>
          </div>
        </template>

        <!-- List of Exercises -->
        <template x-for="(exercise, exIndex) in days[activeDayIndex].exercises" :key="exercise.id">
          <div class="bg-slate-900 border border-slate-800/90 rounded-2xl overflow-hidden shadow-lg transition-all duration-200">
            
            <!-- Exercise Header -->
            <div class="bg-slate-800/60 p-4 border-b border-slate-800/80 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3 flex-1 min-w-[200px]">
                <span class="p-2 bg-purple-500/10 text-purple-400 rounded-lg text-sm">
                  <i class="fa-solid fa-pen-clip"></i>
                </span>
                <input 
                  type="text" 
                  x-model="exercise.name" 
                  @input="saveToLocalStorage()"
                  placeholder="Nombre del Ejercicio (ej. Press Plano)"
                  class="bg-slate-950 border border-slate-700/70 focus:border-purple-500 rounded-lg px-3 py-1.5 text-base font-bold text-slate-100 w-full transition"
                />
              </div>

              <div class="flex items-center gap-2">
                <button 
                  @click="addSet(activeDayIndex, exIndex)"
                  class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-purple-300 rounded-lg text-xs font-semibold border border-purple-500/30 transition flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-plus text-[10px]"></i>
                  <span>Agregar Serie</span>
                </button>
                <button 
                  @click="deleteExercise(activeDayIndex, exIndex)"
                  class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-950/40 rounded-lg transition"
                  title="Eliminar Ejercicio"
                >
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>

            <!-- Sets List Container -->
            <div class="p-4 overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[480px]">
                <thead>
                  <tr class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800">
                    <th class="py-2 px-3 w-16">Serie</th>
                    <th class="py-2 px-3">Peso (kg)</th>
                    <th class="py-2 px-3">Reps</th>
                    <th class="py-2 px-3 text-center w-28">Estado</th>
                    <th class="py-2 px-3 text-right w-12"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/50">
                  <template x-for="(set, setIndex) in exercise.sets" :key="setIndex">
                    <tr class="group hover:bg-slate-800/30 transition-colors" :class="{'bg-emerald-950/10': set.completed}">
                      
                      <!-- Set Label -->
                      <td class="py-2.5 px-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-slate-800 text-xs font-bold text-slate-300" x-text="setIndex + 1"></span>
                      </td>

                      <!-- Weight Input -->
                      <td class="py-2.5 px-3">
                        <div class="relative">
                          <input 
                            type="number" 
                            step="0.5" 
                            min="0"
                            x-model.number="set.weight" 
                            @input="saveToLocalStorage()"
                            class="w-24 bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-lg px-2.5 py-1 text-sm font-semibold text-slate-200 text-center"
                            placeholder="0"
                          />
                        </div>
                      </td>

                      <!-- Reps Input -->
                      <td class="py-2.5 px-3">
                        <input 
                          type="number" 
                          min="0"
                          x-model.number="set.reps" 
                          @input="saveToLocalStorage()"
                          class="w-20 bg-slate-950 border border-slate-800 focus:border-purple-500 rounded-lg px-2.5 py-1 text-sm font-semibold text-slate-200 text-center"
                          placeholder="0"
                        />
                      </td>

                      <!-- Checkbox / Completed Status -->
                      <td class="py-2.5 px-3 text-center">
                        <button 
                          @click="set.completed = !set.completed; saveToLocalStorage()"
                          :class="{
                            'bg-emerald-500/20 text-emerald-400 border-emerald-500/50': set.completed,
                            'bg-slate-800/80 text-slate-400 border-slate-700 hover:border-slate-500': !set.completed
                          }"
                          class="px-3 py-1 rounded-lg text-xs font-semibold border transition flex items-center justify-center gap-1.5 mx-auto w-full max-w-[100px]"
                        >
                          <i class="fa-solid" :class="set.completed ? 'fa-circle-check text-emerald-400' : 'fa-circle opacity-40'"></i>
                          <span x-text="set.completed ? 'Hecho' : 'Pendiente'"></span>
                        </button>
                      </td>

                      <!-- Delete Set -->
                      <td class="py-2.5 px-3 text-right">
                        <button 
                          @click="deleteSet(activeDayIndex, exIndex, setIndex)" 
                          class="p-1 text-slate-500 hover:text-rose-400 transition"
                          title="Eliminar Serie"
                        >
                          <i class="fa-solid fa-xmark"></i>
                        </button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>

              <!-- Add Set quick footer button -->
              <div class="mt-3 pt-2 border-t border-slate-800/40 flex justify-start">
                <button 
                  @click="addSet(activeDayIndex, exIndex)"
                  class="text-xs text-purple-400 hover:text-purple-300 font-medium inline-flex items-center gap-1 transition px-2 py-1 rounded hover:bg-slate-800/50"
                >
                  <i class="fa-solid fa-plus text-[10px]"></i>
                  <span>Agregar otra serie</span>
                </button>
              </div>

            </div>
          </div>
        </template>

      </div>
    </section>
  </main>

  <footer class="border-t border-slate-800/80 bg-slate-950 py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
      RutaFit Workout Tracker &bull; Datos guardados automáticamente en tu navegador.
    </div>
  </footer>

  <!-- Alpine Application Logic -->
  <script>
    function workoutApp() {
      // Default initial workout layout template
      const defaultDays = [
        {
          name: 'Día 1: Pecho y Tríceps',
          exercises: [
            {
              id: Date.now() + 1,
              name: 'Press de Banca Plano',
              sets: [
                { reps: 12, weight: 60, completed: true },
                { reps: 10, weight: 70, completed: true },
                { reps: 8, weight: 80, completed: false }
              ]
            },
            {
              id: Date.now() + 2,
              name: 'Extensiones de Tríceps en Polea',
              sets: [
                { reps: 12, weight: 25, completed: false },
                { reps: 12, weight: 30, completed: false }
              ]
            }
          ]
        },
        { name: 'Día 2: Espalda y Bíceps', exercises: [] },
        { name: 'Día 3: Hombro y Abdomen', exercises: [] },
        { name: 'Día 4: Pierna Completa', exercises: [] },
        { name: 'Día 5: Torso / Upper Body', exercises: [] },
        { name: 'Día 6: Pierna / Lower Body', exercises: [] }
      ];

      return {
        activeDayIndex: 0,
        days: [],

        init() {
          const savedData = localStorage.getItem('rutafit_workout_data');
          if (savedData) {
            try {
              this.days = JSON.parse(savedData);
            } catch (e) {
              this.days = defaultDays;
            }
          } else {
            this.days = defaultDays;
          }
        },

        saveToLocalStorage() {
          localStorage.setItem('rutafit_workout_data', JSON.stringify(this.days));
        },

        resetData() {
          if (confirm('¿Estás seguro de que quieres restablecer todas las rutinas a su estado predeterminado?')) {
            localStorage.removeItem('rutafit_workout_data');
            location.reload();
          }
        },

        addExercise(dayIndex) {
          this.days[dayIndex].exercises.push({
            id: Date.now(),
            name: '',
            sets: [
              { reps: 10, weight: 0, completed: false },
              { reps: 10, weight: 0, completed: false },
              { reps: 10, weight: 0, completed: false }
            ]
          });
          this.saveToLocalStorage();
        },

        deleteExercise(dayIndex, exerciseIndex) {
          this.days[dayIndex].exercises.splice(exerciseIndex, 1);
          this.saveToLocalStorage();
        },

        addSet(dayIndex, exerciseIndex) {
          const sets = this.days[dayIndex].exercises[exerciseIndex].sets;
          const lastSet = sets[sets.length - 1];
          // Copy values from previous set if available
          const reps = lastSet ? lastSet.reps : 10;
          const weight = lastSet ? lastSet.weight : 0;
          
          sets.push({ reps: reps, weight: weight, completed: false });
          this.saveToLocalStorage();
        },

        deleteSet(dayIndex, exerciseIndex, setIndex) {
          this.days[dayIndex].exercises[exerciseIndex].sets.splice(setIndex, 1);
          this.saveToLocalStorage();
        },

        getTotalExercises() {
          return this.days.reduce((total, day) => total + day.exercises.length, 0);
        },

        getTotalSetsCount() {
          const currentExercises = this.days[this.activeDayIndex]?.exercises || [];
          return currentExercises.reduce((total, ex) => total + ex.sets.length, 0);
        },

        getCompletedSetsCount() {
          const currentExercises = this.days[this.activeDayIndex]?.exercises || [];
          return currentExercises.reduce((total, ex) => {
            return total + ex.sets.filter(s => s.completed).length;
          }, 0);
        },

        getTodayVolume() {
          const currentExercises = this.days[this.activeDayIndex]?.exercises || [];
          return currentExercises.reduce((total, ex) => {
            return total + ex.sets.reduce((exTotal, s) => {
              return s.completed ? exTotal + ((s.reps || 0) * (s.weight || 0)) : exTotal;
            }, 0);
          }, 0);
        }
      };
    }
  </script>
</body>
</html>
